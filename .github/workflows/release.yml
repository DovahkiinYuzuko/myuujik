name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-artifacts:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            format: msi
            artifact_name: windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            format: deb
            artifact_name: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            format: dmg
            artifact_name: macos-aarch64
          - os: macos-13
            target: x86_64-apple-darwin
            format: dmg
            artifact_name: macos-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies (ALSA)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.10.2

      - name: Install cargo-packager
        run: cargo binstall -y --force cargo-packager

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package installer (${{ matrix.format }})
        run: cargo packager --release --formats ${{ matrix.format }} --target ${{ matrix.target }}

      - name: Create portable archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path dist)) { New-Item -ItemType Directory -Path dist }
          Compress-Archive -Path "target/${{ matrix.target }}/release/myuujik.exe", "README.md", "LICENSE.MIT" -DestinationPath "dist/myuujik-${{ matrix.artifact_name }}.zip"

      - name: Create portable archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czvf "dist/myuujik-${{ matrix.artifact_name }}.tar.gz" -C "target/${{ matrix.target }}/release" myuujik

      - name: Upload temporary build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.artifact_name }}
          path: dist/**/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find downloaded-artifacts -type f \( -name "*.msi" -o -name "*.deb" -o -name "*.dmg" -o -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release-assets/ \;
          echo "=== Collected Release Assets ==="
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
