[package]
name = "myuujik"
version = "0.1.0"
edition = "2021"
description = "High-quality, ultra-lightweight TUI audio player in Rust"
license = "MIT"

# ==========================================
# cargo-packager によるマルチOSインストーラー生成設定
# ==========================================
[package.metadata.packager]
product-name = "myuujik"
identifier = "com.YuzukoUnderson.myuujik"
authors = ["Yuzuko Underson"]
description = "High-quality, ultra-lightweight TUI audio player in Rust"
copyright = "Copyright (c) 2026 Yuzuko Underson"
out-dir = "dist"

[package.metadata.packager.targets]
msi = { }
deb = { depends = ["libasound2"] }
dmg = { }

[dependencies]
# Audio Decoding & Metadata
symphonia = { version = "0.5", features = ["all"] }
symphonia-adapter-libopus = "0.2"

# Audio Output (Cross-platform Shared)
cpal = "0.15"

# Realtime Lock-Free SPSC Ring Buffer
rtrb = "0.3"

# TUI & Terminal Control
ratatui = "0.29"
crossterm = "0.28"
ratatui-image = "3.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Multi-language & Localization
rokeeru-core = "0.1"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# CLI & Directory Scan
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
crossbeam-channel = "0.5"
directories = "5.0"
rand = "0.8"

# Acoustic Fingerprinting & HTTP Lyrics Fetcher
chromaprint-next = "0.1"
ureq = { version = "2.10", features = ["tls", "json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Gdi",
] }


[profile.dev]
# デバッグ情報をライン番号のみに削減（PDB生成を劇的に軽量化）
debug = 1

# 依存クレート（symphonia, windows, ratatui など）だけ最適化
# 初回ビルド後はキャッシュされ、2回目以降は自作コードのみの爆速ビルドになります。
[profile.dev.package."*"]
opt-level = 2

# ==========================================
# リリース時（cargo build --release）の設定
# ==========================================
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "abort"
strip = true
